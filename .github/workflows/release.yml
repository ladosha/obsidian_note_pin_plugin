# Builds the plugin when a version tag is pushed (git tag -a 1.0.1 -m "1.0.1"; git push origin 1.0.1) and makes a
# draft release with the three files Obsidian installs. The tag must match "version" in manifest.json.
# From https://docs.obsidian.md/Plugins/Releasing/Release+your+plugin+with+GitHub+Actions, with the tests added.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # The tests run the TypeScript sources directly, which needs Node 22.18 or later.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
